<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TAPNIVO | Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .topbar {
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #4f46e5;
    }

    .admin {
      font-size: 14px;
      color: #6b7280;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .welcome {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #6b7280;
    }

    .add-button {
      background: #4f46e5;
      color: white;
      text-decoration: none;
      padding: 13px 18px;
      border-radius: 10px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 35px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 22px;
    }

    .stat-title {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
    }

    .clients-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .clients-header h2 {
      font-size: 21px;
    }

    .search {
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
      width: 230px;
    }

    .clients {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .client {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .client-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #eef2ff;
      color: #4f46e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .client-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .client-job {
      color: #6b7280;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      margin-top: 7px;
      font-size: 11px;
      color: #047857;
      background: #d1fae5;
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: bold;
    }

    .client-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action {
      padding: 9px 13px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #d1d5db;
      color: #374151;
      background: white;
    }

    .action.primary {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border: 1px dashed #d1d5db;
      border-radius: 15px;
      color: #6b7280;
      display: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (max-width: 700px) {

      .welcome {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .clients-header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .search {
        width: 100%;
      }

      .client {
        flex-direction: column;
        align-items: flex-start;
      }

      .client-actions {
        width: 100%;
      }

      .action {
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <div class="logo">
      TAP<span>NIVO</span>
    </div>

    <div class="admin">
      Admin
    </div>

  </header>


  <main class="container">

    <section class="welcome">

      <div>
        <h1>Dashboard</h1>
        <p>Gérez vos clients et leurs profils TAPNIVO.</p>
      </div>

      <button class="add-button" onclick="addClient()">
        + Ajouter un client
      </button>

    </section>


    <section class="stats">

      <div class="stat">
        <div class="stat-title">
          Clients
        </div>

        <div class="stat-number">
          1
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Cartes actives
        </div>

        <div class="stat-number">
          1
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Vues du profil
        </div>

        <div class="stat-number">
          0
        </div>
      </div>

    </section>


    <section>

      <div class="clients-header">

        <h2>
          Mes clients
        </h2>

        <input
          class="search"
          type="search"
          placeholder="Rechercher un client..."
          oninput="searchClients(this.value)"
        >

      </div>


      <div class="clients" id="clients">


        <!-- CLIENT 1 -->

        <div class="client" data-name="Yassine Immobilier">

          <div class="client-info">

            <div class="avatar">
              Y
            </div>

            <div>

              <div class="client-name">
                Yassine Immobilier
              </div>

              <div class="client-job">
                Agent Immobilier • Fès
              </div>

              <div class="status">
                ● Active
              </div>

            </div>

          </div>


          <div class="client-actions">

            <a
              class="action primary"
              href="/yassine/"
              target="_blank"
            >
              Voir
            </a>

            <a
              class="action"
              href="#"
              onclick="editClient()"
            >
              Modifier
            </a>

          </div>

        </div>


      </div>


      <div class="empty" id="empty">

        Aucun client trouvé.

      </div>

    </section>

  </main>


  <footer>

    TAPNIVO Dashboard • 2026

  </footer>


  <script>

    function searchClients(value) {

      const clients =
        document.querySelectorAll(".client");

      const search =
        value.toLowerCase().trim();

      let visible = 0;

      clients.forEach(function(client) {

        const name =
          client.dataset.name.toLowerCase();

        if (name.includes(search)) {

          client.style.display = "flex";
          visible++;

        } else {

          client.style.display = "none";

        }

      });


      document.getElementById("empty").style.display =
        visible === 0 ? "block" : "none";

    }


    function addClient() {

      alert(
        "La création de clients sera connectée à la base de données dans la prochaine étape."
      );

    }


    function editClient() {

      alert(
        "La modification des clients sera disponible avec le système de gestion des profils."
      );

    }

  </script>

</body>
</html>
